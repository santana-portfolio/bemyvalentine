<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour ma Valentine ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 10;
            position: relative; /* Important pour le positionnement absolu des enfants */
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4b72;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        .kazuma-img {
            width: 250px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 60px; /* Un peu plus d'espace pour le mouvement */
        }

        button {
            padding: 10px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
            z-index: 20; /* S'assure que les boutons sont au-dessus */
        }

        #btn-yes {
            background-color: #ff4b72;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 75, 114, 0.4);
        }

        #btn-yes:hover {
            transform: scale(1.1);
            background-color: #ff2a55;
        }

        #btn-no {
            background-color: #f1f1f1;
            color: #333;
            position: absolute; /* Absolu par défaut pour faciliter le mouvement */
            right: 20px; /* Position initiale */
        }

        /* Container for the success message (hidden by default) */
        #success-container {
            display: none;
            text-align: center;
        }

        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="hearts" id="hearts-container"></div>

    <div class="card" id="main-card">
        <img src="https://media.tenor.com/b2HwzLof4vIAAAAC/kazuma-konosuba.gif" alt="Kazuma Sato smug" class="kazuma-img">
        
        <h1>Veux-tu être ma Valentine ?</h1>
        <p>Même Kazuma pense que c'est une bonne idée...</p>
        
        <div class="buttons">
            <button id="btn-yes">Oui ! ❤️</button>
            <button id="btn-no">Non...</button>
        </div>
    </div>

    <div class="card" id="success-container">
        <img src="https://media.tenor.com/f04Tj9yK-C0AAAAC/kazuma-thumbs-up.gif" alt="Kazuma Thumbs Up" class="kazuma-img">
        <h1>Génial ! 🎉</h1>
        <p>Prépare-toi pour le meilleur rendez-vous de ta vie (sans crapauds géants, promis).</p>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const mainCard = document.getElementById('main-card');
        const successContainer = document.getElementById('success-container');
function moveButton(e) {
            // Empêche le clic par défaut sur mobile si on touche le bouton
            if(e.type === 'touchstart') e.preventDefault();

            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 50);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = ${x}px;
            btnNo.style.top = ${y}px;
        }

        // Événement Souris (PC)
        btnNo.addEventListener('mouseover', moveButton);
        
        // Événement Toucher (Mobile/Tablette) - C'est la partie ajoutée !
        btnNo.addEventListener('touchstart', moveButton);

        // Au cas où quelqu'un arrive à cliquer quand même
        btnNo.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton(e);
        });

        // Function for when she clicks "Yes"
        btnYes.addEventListener('click', () => {
            mainCard.style.display = 'none';
            successContainer.style.display = 'block';
            createHearts();
        });

        // Add some falling hearts animation for the background
        function createHearts() {
            const container = document.getElementById('hearts-container');
            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.style.position = 'absolute';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = '-20px';
                    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
                    heart.style.transition = 'top 3s linear, opacity 3s linear';
                    heart.style.opacity = '1';
                    
                    container.appendChild(heart);

                    // Animate
                    setTimeout(() => {
                        heart.style.top = '100vh';
                        heart.style.opacity = '0';
                    }, 50);

                    // Clean up
                    setTimeout(() => {
                        heart.remove();
                    }, 3000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
        // Fonction pour déplacer le bouton (compatible mobile et desktop)
